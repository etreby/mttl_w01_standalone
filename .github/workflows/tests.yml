name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Firmware self-test (host build with in-tree flash/Wi-Fi mocks)
        run: source/standalone/run_host_selftest.sh
      - name: Install Playwright for the Home Assistant card test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Dashboard and OTA UI tests
        run: |
          set -e
          for t in source/standalone/tests/*.cjs ha-card/test_timer.cjs; do
            echo "== $t"; node "$t"
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Device UI markup minifier tests
        run: python3 source/standalone/tests/test_minify_markup.py
      - name: Version consistency and release verifier tests
        run: |
          set -e
          python3 -m pip install --disable-pip-version-check 'cryptography==50.0.2'
          python3 source/standalone/tests/test_version.py
          python3 tools/test_verify_release.py
